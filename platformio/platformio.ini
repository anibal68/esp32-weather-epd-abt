; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32c6_supermini
; default_envs = dfrobot_firebeetle2_esp32e
; default_envs = firebeetle32


; default options for each '[env:**]'
[env]
platform = espressif32 @ 6.13.0
framework = arduino
build_unflags = '-std=gnu++11'
build_flags = '-Wall' '-std=gnu++17'
; só os ícones usados (o conjunto inteiro não cabe na memória do Pi)
extra_scripts = pre:gerar_icones.py
lib_deps =
  adafruit/Adafruit AHTX0 @ 2.0.5
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit Unified Sensor @ 1.1.15
  bblanchon/ArduinoJson @ 7.4.3
  zinggjm/GxEPD2 @ 1.6.8


[env:dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = huge_app.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L


[env:firebeetle32]
board = firebeetle32
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = huge_app.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L


; ESP32-C6 Super Mini (Aníbal). O C6 precisa do Arduino 3.x: plataforma pioarduino (não a oficial 6.x).
[env:esp32c6_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
; a placa tem 4 MB: sem isto o cabeçalho do .bin diz 8 MB e o C6 não arranca
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
; 2 espaços de 1,9 MB para as atualizações por Wi-Fi (huge_app só tinha 1)
board_build.partitions = min_spiffs.csv
build_flags = '-Wall' '-std=gnu++17' -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
